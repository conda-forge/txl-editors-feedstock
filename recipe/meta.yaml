{% set python_min = "3.10" %}
{% set name = "txl-editors" %}
{% set version = "0.3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/txl_editors-{{ version }}.tar.gz
  sha256: 96f319fc524ae98c0200689edca550adc24123da71f5be44199b076c10cc394d

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - txl =0.3.2

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - txl_editors

about:
  home: https://github.com/davidbrochart/jpterm/blob/main/plugins/editors
  summary: TXL plugin for editors
  dev_url: https://github.com/davidbrochart/jpterm/blob/main/plugins/editors
  license_file: LICENSE.txt
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
